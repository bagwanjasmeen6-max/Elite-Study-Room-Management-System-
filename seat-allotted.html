<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Allotted Successfully - Elite Study Rooms</title>
  <link rel="stylesheet" href="portal.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    .success-icon {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      background: #ecfdf5;
      color: var(--good);
      border: 1px solid #a7f3d0;
      font-size: 34px;
    }

    .print-token {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 8px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      font-size: 28px;
      font-weight: 800;
    }

    .allotment-card {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .allotment-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }

    .allotment-row span:first-child {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .allotment-row span:last-child {
      font-weight: 800;
      text-align: right;
    }

    @media print {
      .topbar,
      .nav-actions,
      .actions {
        display: none !important;
      }

      body {
        background: #fff !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="firstpageweb.html">
        <span class="brand-mark"><i class="fa-solid fa-check"></i></span>
        <span>ELITE<br><small>Allotment</small></span>
      </a>
      <nav class="nav-actions">
        <a class="button secondary" href="userportal.html"><i class="fa-solid fa-calendar-check"></i> Portal</a>
        <a class="button secondary" href="firstpageweb.html"><i class="fa-solid fa-house"></i> Home</a>
      </nav>
    </header>

    <section class="hero">
      <div class="hero-panel">
        <div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
        <p class="eyebrow"><i class="fa-solid fa-chair"></i> Booking Confirmed</p>
        <h1>Seat allotted successfully.</h1>
        <p class="lead">Your payment is complete. Print this token for entry.</p>
        <div class="print-token"><i class="fa-solid fa-ticket"></i><span id="tokenValue">-</span></div>
        <div id="message" class="notice" hidden></div>
      </div>

      <section class="panel">
        <div class="toolbar">
          <div>
            <p class="eyebrow"><i class="fa-solid fa-receipt"></i> Final Receipt</p>
            <h2>Allotment Details</h2>
          </div>
          <span id="statusBadge" class="badge">Loading</span>
        </div>

        <div class="allotment-card">
          <div class="allotment-row"><span>Token</span><span id="bookingIdValue">-</span></div>
          <div class="allotment-row"><span>Student</span><span id="studentValue">-</span></div>
          <div class="allotment-row"><span>Room / Zone</span><span id="roomValue">-</span></div>
          <div class="allotment-row"><span>Seat</span><span id="seatValue">-</span></div>
          <div class="allotment-row"><span>Slot</span><span id="slotValue">-</span></div>
          <div class="allotment-row"><span>Date</span><span id="dateValue">-</span></div>
          <div class="allotment-row"><span>Amount Paid</span><span id="amountValue">-</span></div>
          <div class="allotment-row"><span>Payment Method</span><span id="methodValue">-</span></div>
          <div class="allotment-row"><span>Transaction Ref</span><span id="txValue">-</span></div>
        </div>

        <div class="actions" style="margin-top:18px;">
          <button class="button secondary" id="printBtn" type="button"><i class="fa-solid fa-print"></i> Print</button>
          <a class="button" href="userportal.html"><i class="fa-solid fa-house"></i> Go to Portal</a>
        </div>
      </section>
    </section>
  </main>

  <script>
    if (location.protocol === 'file:') {
      const webUrl = `http://localhost/elite%20study%20room%20management/seat-allotted.html${location.search}`;
      document.body.innerHTML = `
        <main class="shell">
          <section class="panel" style="max-width:720px;margin:60px auto;">
            <p class="eyebrow"><i class="fa-solid fa-triangle-exclamation"></i> Open With XAMPP</p>
            <h1 style="font-size:42px;">Please open allotment through localhost.</h1>
            <p class="lead">PHP pages only work through XAMPP/Apache. Local file mode cannot load booking or payment details.</p>
            <div class="actions" style="margin-top:22px;">
              <a class="button" href="${webUrl}"><i class="fa-solid fa-arrow-right"></i> Open Allotment Page</a>
            </div>
          </section>
        </main>
      `;
      throw new Error('Open this page through localhost, not file mode.');
    }

    const apiBase = './api/payment_api.php';
    const qs = new URLSearchParams(location.search);
    const bookingId = qs.get('bookingId') || '';
    const $ = (id) => document.getElementById(id);

    function showMessage(text, type) {
      const box = $('message');
      box.hidden = false;
      box.className = `notice ${type || ''}`;
      box.textContent = text;
    }

    function setStatus(status) {
      const cleanStatus = String(status || 'paid').toLowerCase();
      $('statusBadge').textContent = cleanStatus;
      $('statusBadge').className = `badge ${cleanStatus}`;
    }

    function fillDetails(receipt) {
      const token = receipt.receiptToken || String(receipt.bookingId || '').replace(/^booking-/, '').replace(/^BK-/, 'BK').slice(-8).toUpperCase();
      $('tokenValue').textContent = token || '-';
      $('bookingIdValue').textContent = token || '-';
      $('studentValue').textContent = receipt.userName || '-';
      $('roomValue').textContent = receipt.roomName || '-';
      $('seatValue').textContent = receipt.seatLabel || '-';
      $('slotValue').textContent = receipt.slotLabel || '-';
      $('dateValue').textContent = receipt.date || '-';
      $('amountValue').textContent = `Rs. ${Number(receipt.amount || 0).toFixed(2)}`;
      $('methodValue').textContent = receipt.method ? String(receipt.method).toUpperCase() : '-';
      $('txValue').textContent = receipt.transactionRef || '-';
      setStatus(receipt.status);
    }

    async function loadAllotment() {
      if (!bookingId) {
        setStatus('missing');
        showMessage('Missing bookingId in URL.', 'bad');
        return;
      }

      try {
        const res = await fetch(`${apiBase}?action=receipt&bookingId=${encodeURIComponent(bookingId)}`);
        const text = await res.text();
        const json = JSON.parse(text);
        if (!json.ok) {
          setStatus('error');
          showMessage(json.error || 'Could not load allotment details.', 'bad');
          return;
        }

        fillDetails(json.receipt);
        if (String(json.receipt.status || '').toLowerCase() === 'paid') {
          showMessage('Seat allotted successfully. Please keep this receipt for entry.', 'good');
        } else {
          showMessage('Payment is not marked paid yet. Please complete payment to confirm this seat.', 'bad');
        }
      } catch (error) {
        setStatus('error');
        showMessage(String(error?.message || error), 'bad');
      }
    }

    $('printBtn').addEventListener('click', () => window.print());
    loadAllotment();
  </script>
</body>
</html>
